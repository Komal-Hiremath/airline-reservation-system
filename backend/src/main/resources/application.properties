spring.application.name=airport-management
server.servlet.context-path=/api/v1

# ---- Database -------------------------------------------------------------
# Default is MySQL (as in the PRD). The schema is created automatically.
# To use PostgreSQL instead, set DB_URL=jdbc:postgresql://localhost:5432/AirportDB
# (plus DB_USERNAME / DB_PASSWORD). The driver is detected from the URL.
spring.datasource.url=jdbc:postgresql://localhost:5432/AirportDB
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ------------------------------------------------------------------
# Base64 encoded key (at least 32 bytes). The default below is for LOCAL DEVELOPMENT ONLY.
# In any shared or real environment set JWT_SECRET to your own value.
jwt.secret=${JWT_SECRET:ZGV2LW9ubHktYWlybGluZS1yZXNlcnZhdGlvbi1qd3Qta2V5LWNoYW5nZS1tZQ==}
jwt.expiration=86400000

# ---- Seed data ------------------------------------------------------------
app.seed.enabled=true
app.admin.email=${ADMIN_EMAIL:admin@airline.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ---- CORS (comma separated list of allowed browser origins) ---------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

logging.level.org.springframework.security=INFO
